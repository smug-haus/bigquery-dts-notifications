name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  cli:
    name: fmcourse CLI (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/fmcourse/package-lock.json
      - name: Install
        working-directory: tools/fmcourse
        run: npm ci || npm install
      - name: Typecheck
        working-directory: tools/fmcourse
        run: npm run typecheck
      - name: Test
        working-directory: tools/fmcourse
        run: npm test

  structure:
    name: Structural checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node test/check-structure.mjs

  lean:
    name: Lean build
    runs-on: ubuntu-latest
    # The Lean build pulls Mathlib + cslib transitively and is slow.
    # Enabled behind a repository variable so early iteration is fast.
    if: ${{ vars.ENABLE_LEAN_CI == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install toolchain
        run: elan toolchain install "$(cat lean-toolchain)"
      - name: lake build
        run: lake update && lake build
      - name: No sorry in Exercises/
        run: |
          if grep -rn --include='*.lean' '\bsorry\b' Exercises/ ; then
            echo "::error::sorry found in Exercises/"
            exit 1
          fi
